# Labels each pull request by the area it touches. Every PR merges into
# staging on the gates in AGENTS.md, so these labels do not decide a merge.
# `ui` when any changed file is under frontend/ (mixed PRs count as UI);
# `backend` only when every changed file is under backend/ or is Markdown
# under docs/, and at least one is under backend/; otherwise no area label.
# staging-smoke.yml reverts a PR labeled `backend` automatically when the
# staging smoke test fails after its merge.
# The label is recomputed on every push, so a PR that later touches
# frontend/ flips to `ui`.
name: pr kind label

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-kind-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Label ui or backend
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -q '^frontend/' <<<"$files"; then
            kind=ui
          elif grep -q '^backend/' <<<"$files" \
            && ! grep -qEv '^backend/|^docs/.*\.md$' <<<"$files"; then
            kind=backend
          else
            kind=none
          fi

          gh label create ui --repo "$REPO" --color 1d76db --description "Touches frontend/" --force >/dev/null
          gh label create backend --repo "$REPO" --color 0e8a16 --description "Backend only; auto-revert on staging smoke failure" --force >/dev/null

          case "$kind" in
            ui) gh pr edit "$PR" --repo "$REPO" --add-label ui --remove-label backend ;;
            backend) gh pr edit "$PR" --repo "$REPO" --add-label backend --remove-label ui ;;
            none) gh pr edit "$PR" --repo "$REPO" --remove-label ui --remove-label backend ;;
          esac
          echo "PR #$PR labeled $kind" >> "$GITHUB_STEP_SUMMARY"
