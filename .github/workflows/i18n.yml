name: i18n

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  check:
    name: Generated artefacts in sync with catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v1.0.0-beta.25
      # sdk/ and clients/ under .dagger/modules/skynet-ci are generated, not committed.
      - name: Generate the Dagger module SDK
        run: dagger generate -y
      - name: Verify codegen drift, naming regex, schema
        run: dagger check skynet-ci/locale-drift
