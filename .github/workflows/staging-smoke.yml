# Gate 5 of the merge policy in AGENTS.md: after a push to staging is live,
# smoke-test staging. Every PR merges on the gates with no human approval, so
# any PR can break staging. This workflow never reverts anything. If the smoke
# test fails and exactly one merged PR has the tested commit as its merge
# commit, comment on that PR and reopen its Linear issue with the failure.
# The orchestrator then opens a revert PR by hand. Otherwise (no PR, many
# PRs, a `batch/` merge or a manual run), it reports on the run summary only.
#
# It runs after "staging deploy" succeeds, which already waits until staging
# serves the pushed commit. When that deploy check fails, this workflow does
# not run: staging may simply not have come up, so look at the deploy first.
#
# Configuration (Settings > Secrets and variables > Actions):
#   vars.STAGING_APP_URL     shared with staging-deploy.yml
#   vars.STAGING_API_URL     shared with staging-deploy.yml
#   vars.LINEAR_TEAM_KEY     e.g. SKY; optional, enables reopening the issue
#   secrets.LINEAR_API_KEY   optional, enables reopening the issue
name: staging smoke

on:
  workflow_run:
    workflows: ["staging deploy"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-smoke
  cancel-in-progress: false

permissions: {}

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      APP_URL: ${{ vars.STAGING_APP_URL || 'https://staging.skynetml.com' }}
      API_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.skynetml.com' }}
    outputs:
      failed: ${{ steps.checks.outputs.failed }}
      report: ${{ steps.checks.outputs.report }}
    steps:
      - name: Smoke-test staging
        id: checks
        run: |
          failures=()
          # Each check gets three tries so one slow request is not a failure.
          check() {
            local name=$1 url=$2 filter=$3 body
            for _ in 1 2 3; do
              if body=$(curl -sS -f -L --max-time 20 "$url" 2>/dev/null) \
                && { [ -z "$filter" ] || jq -e "$filter" <<<"$body" >/dev/null 2>&1; }; then
                echo "ok   $name"
                return 0
              fi
              sleep 10
            done
            echo "FAIL $name ($url)"
            failures+=("$name")
          }

          check "backend health"   "$API_URL/health"   '.status == "ok"'
          check "optimizer registry" "$API_URL/registry" '(.optimizers | length) > 0'
          check "model catalog"    "$API_URL/models"   '(.models | length) > 0'
          check "frontend"         "$APP_URL/"         ''

          if [ ${#failures[@]} -eq 0 ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "### Staging smoke passed" >> "$GITHUB_STEP_SUMMARY"
          else
            report="Staging smoke failed: ${failures[*]}"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "report=$report" >> "$GITHUB_OUTPUT"
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
          fi

  report:
    needs: smoke
    if: needs.smoke.outputs.failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Empty on a manual run: the tested commit is unknown, so no PR is found.
      SHA: ${{ github.event.workflow_run.head_sha }}
      REPORT: ${{ needs.smoke.outputs.report }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LINEAR_TEAM_KEY: ${{ vars.LINEAR_TEAM_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - name: Find the PR whose merge was tested
        id: pr
        run: |
          prs='[]'
          if [ -n "$SHA" ]; then
            prs=$(gh api "repos/$REPO/commits/$SHA/pulls?per_page=100" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"staging\" and .merge_commit_sha == \"$SHA\")]")
          fi
          count=$(jq 'length' <<<"$prs")
          branch=$(jq -r '.[0].head.ref // empty' <<<"$prs")
          # A batch merge holds many PRs, so the failing one is unknown.
          if [ "$count" -eq 1 ] && [[ "$branch" != batch/* ]]; then
            {
              echo "number=$(jq -r '.[0].number' <<<"$prs")"
              echo "title=$(jq -r '.[0].title // empty' <<<"$prs")"
              echo "branch=$branch"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No single merged PR has ${SHA:-the tested commit} as its merge commit ($count found, head \`${branch:-none}\`). Find the failing PR by hand. Run: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on the PR
        if: steps.pr.outputs.number != ''
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$NUMBER" --repo "$REPO" \
            --body "**$REPORT** after this PR landed on staging ($SHA). Nothing was reverted automatically. The orchestrator opens a revert PR by hand. Run: $RUN_URL"

      - name: Reopen the Linear issue
        if: steps.pr.outputs.number != '' && env.LINEAR_API_KEY != '' && env.LINEAR_TEAM_KEY != ''
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          def gql(query, variables):
              req = urllib.request.Request(
                  "https://api.linear.app/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Content-Type": "application/json",
                           "Authorization": os.environ["LINEAR_API_KEY"]},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      payload = json.load(resp)
              except (urllib.error.URLError, ValueError) as exc:
                  print(f"::warning::Linear API request failed: {exc}")
                  return {}
              for err in payload.get("errors") or []:
                  print(f"::warning::Linear API error: {err.get('message')}")
              return payload.get("data") or {}

          # A Linear failure must not fail the job (the PR comment is the main
          # report), but the log and the run summary must show it.
          def warn(message):
              print(f"::warning::{message}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(message + "\n")

          team = os.environ["LINEAR_TEAM_KEY"]
          pattern = re.compile(rf"\b{re.escape(team)}-\d+\b", re.IGNORECASE)
          match = pattern.search(os.environ["PR_BRANCH"]) or pattern.search(os.environ["PR_TITLE"])
          if not match:
              print("No Linear issue key on the PR; nothing to reopen.")
              raise SystemExit(0)
          key = match.group(0).upper()

          issue = gql("query($id: String!) { issue(id: $id) { id team { states { nodes { id name type } } } } }",
                      {"id": key}).get("issue")
          if not issue:
              warn(f"Linear reopen failed: issue {key} not found.")
              raise SystemExit(0)
          states = issue["team"]["states"]["nodes"]
          todo = next((s for s in states if s["name"] == "Todo"), None) \
              or next((s for s in states if s["type"] == "unstarted"), None)
          moved = False
          if todo:
              moved = (gql("mutation($id: String!, $s: String!) { issueUpdate(id: $id, input: {stateId: $s}) { success } }",
                           {"id": issue["id"], "s": todo["id"]}).get("issueUpdate") or {}).get("success") is True
          commented = (gql("mutation($id: String!, $b: String!) { commentCreate(input: {issueId: $id, body: $b}) { success } }",
                           {"id": issue["id"],
                            "b": f"{os.environ['REPORT']} after the merge. Nothing was reverted automatically; "
                                 f"the orchestrator opens a revert PR by hand. Run: {os.environ['RUN_URL']}"})
                       .get("commentCreate") or {}).get("success") is True
          if moved and commented:
              print(f"Reopened {key}.")
          else:
              warn(f"Linear reopen failed for {key}: moved to Todo={moved}, comment added={commented}.")
          PY

      - name: Fail the run
        if: always()
        run: |
          echo "::error::$REPORT"
          exit 1
