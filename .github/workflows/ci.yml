name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-core:
    name: backend · core tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies (runtime + dev)
        run: uv sync --extra dev --frozen
      # The credential-free `core/` tier runs without Postgres, an LLM, or a live
      # server; the `tests/` integration tier (DB + paid LLM) is a separate,
      # nightly concern and is intentionally not gated here.
      - name: Core test suite
        env:
          SKYNET_TEST_SHARD: ${{ matrix.shard }}/6
        run: uv run pytest core/ -q -n auto

  backend-gates:
    name: backend · ruff + gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget_test
          POSTGRES_PASSWORD: budget_test
          POSTGRES_DB: budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget_test -d budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies (runtime + dev)
        run: uv sync --extra dev --frozen
      - name: Ruff lint
        run: uv run ruff check .
      # requirements.txt is the pip install path's copy of uv.lock. When only
      # one of the two moves, the pip-path image silently ships a different
      # dependency set than CI ever tested — that drift is how starlette landed
      # on a version the pinned instrumentator rejects, and how `stripe` went
      # missing from the export entirely. Compare pins only, so the hand-written
      # header block above the export is free to differ.
      - name: Requirements sync
        run: |
          uv export --no-emit-project --no-hashes --no-header -o /tmp/req-expected.txt >/dev/null
          if ! diff -u <(grep -vE '^\s*#|^\s*$' requirements.txt) \
                       <(grep -vE '^\s*#|^\s*$' /tmp/req-expected.txt); then
            echo "::error::requirements.txt is out of sync with uv.lock. Regenerate: uv export --no-emit-project --no-hashes --no-header -o requirements.txt (then restore the header block)"
            exit 1
          fi
      - name: PostgreSQL budget concurrency and migration gates
        env:
          SKYNET_BUDGET_TEST_DB_URL: postgresql+psycopg2://budget_test:budget_test@127.0.0.1:5432/budget_test
        run: uv run pytest core/billing/tests/test_budgets_postgres.py core/api/tests/test_run_sync_postgres.py -q
      - name: Load-test SLO gate
        run: uv run pytest tests/unit/test_load_test_slo.py -q

  backend-shard-coverage:
    name: backend · shard coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies (runtime + dev)
        run: uv sync --extra dev --frozen
      - name: Six-shard collection union
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys

          def collect(shard=None):
              env = os.environ.copy()
              env.pop("APP_TEST_SHARD", None)
              env.pop("SKYNET_TEST_SHARD", None)
              if shard is not None:
                  env["SKYNET_TEST_SHARD"] = shard
              result = subprocess.run(
                  [sys.executable, "-m", "pytest", "core/", "--collect-only", "-q"],
                  check=True,
                  capture_output=True,
                  text=True,
                  env=env,
              )
              return [line for line in result.stdout.splitlines() if line.startswith("core/") and "::" in line]

          full = collect()
          if not full:
              raise SystemExit("full collection produced no test nodeids")
          shards = [collect(f"{index}/6") for index in range(6)]
          union = [nodeid for shard in shards for nodeid in shard]
          if len(union) != len(set(union)):
              raise SystemExit("six-shard collection overlaps")
          if set(union) != set(full):
              raise SystemExit(f"six-shard collection differs: full={len(full)} union={len(union)}")
          print(f"six shards cover {len(full)} tests with no overlap")
          PY

  backend:
    name: backend · ruff + core tests (${{ matrix.shard }}/4)
    needs: [backend-core, backend-gates, backend-shard-coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Require core shards and gates
        env:
          CORE_RESULT: ${{ needs.backend-core.result }}
          GATES_RESULT: ${{ needs.backend-gates.result }}
          COVERAGE_RESULT: ${{ needs.backend-shard-coverage.result }}
        run: |
          [[ "$CORE_RESULT" == success && "$GATES_RESULT" == success && "$COVERAGE_RESULT" == success ]]

  # Everything above installs through uv. The Dockerfile's other path
  # (PKG_MANAGER=pip) installs the compiled requirements.txt with --no-deps,
  # which means pip never re-resolves and never notices a package the file
  # forgot to list — `stripe` was absent from requirements.txt while
  # core/billing/service.py imported it unguarded, so a pip-path image would
  # have died on the billing import with nothing in CI to catch it. Build the
  # image that way and import the modules that actually pull the runtime deps.
  docker-pip-path:
    name: docker · pip path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (PKG_MANAGER=pip)
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            PKG_MANAGER=pip
          load: true
          tags: skynet-backend:pip
          cache-from: type=gha,scope=pip
          cache-to: type=gha,mode=min,scope=pip
      # `pip check` is the sharp end: --no-deps means pip installed the file
      # verbatim without ever validating it, so this is the first thing in the
      # pipeline that reads the wheels' own metadata. It catches both failure
      # modes we actually hit — a package the file forgot ("skynet requires
      # stripe, which is not installed") and two pins that cannot coexist
      # ("prometheus-fastapi-instrumentator 7.1.0 has requirement
      # starlette<1.0.0, but you have starlette 1.3.1").
      # The file pins a gepa git commit (reporting 0.1.4) over dspy's hard
      # gepa[dspy]==0.1.4 requirement for upstream OA engines and PxN sampling;
      # the commit's own version satisfies the pin, so everything pip check
      # emits is a real defect.
      - name: Dependency set is complete and self-consistent
        run: |
          out=$(docker run --rm skynet-backend:pip pip check 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qE 'requires|has requirement'; then
            echo "::error::pip check found real dependency problems in the pip-path image"
            exit 1
          fi
      # Importing the modules that pull the third-party surface also catches a
      # missing package, and covers anything pip metadata does not describe.
      # main/worker_main are deliberately excluded: they build the app at import
      # time and open a real Postgres connection, which this job has no business
      # standing up.
      - name: Import smoke test
        run: |
          docker run --rm skynet-backend:pip python -c "
          import core.api.app
          import core.billing.service
          import core.worker.subprocess_runner
          import core.service_gateway.optimization
          from gepa.oa import list_engines
          from gepa.optimize_anything import optimize_best_of
          assert {'gepa', 'meta_harness', 'autoresearch', 'best_of_n'} <= set(list_engines())
          from core.service_gateway.optimization.blackbox.registry import ENGINES
          assert {'autosaddler', 'shinka_evolve'} <= set(ENGINES)
          print('pip-path image imports OK')
          "
      - name: Pinned native optimizer runtime is installed
        run: |
          docker run --rm --network none skynet-backend:pip python -c "
          import shutil, subprocess
          assert subprocess.check_output(['node', '--version'], text=True).strip() == 'v22.22.0'
          assert shutil.which('claude') is None
          "

  frontend-typecheck:
    name: frontend · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: the unit runner uses --experimental-strip-types (Node >= 22.6).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  frontend-lint:
    name: frontend · lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  frontend-unit:
    name: frontend · unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: the unit runner uses --experimental-strip-types (Node >= 22.6).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit

  frontend:
    name: frontend · typecheck + lint + unit
    needs: [frontend-typecheck, frontend-lint, frontend-unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all frontend checks
        env:
          TYPECHECK_RESULT: ${{ needs.frontend-typecheck.result }}
          LINT_RESULT: ${{ needs.frontend-lint.result }}
          UNIT_RESULT: ${{ needs.frontend-unit.result }}
        run: |
          [[ "$TYPECHECK_RESULT" == success && "$LINT_RESULT" == success && "$UNIT_RESULT" == success ]]
