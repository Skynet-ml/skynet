name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CORE_SHARD_COUNT: 6
  DAGGER_VERSION: v1.0.0-beta.25

jobs:
  backend-core:
    name: backend · core tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
      # sdk/ and clients/ under .dagger/modules/skynet-ci are generated, not committed.
      - name: Generate the Dagger module SDK
        run: dagger generate -y
      # The credential-free `core/` tier runs without Postgres, an LLM, or a live
      # server; the `tests/` integration tier (DB + paid LLM) is a separate,
      # nightly concern and is intentionally not gated here.
      - name: Core test suite
        run: dagger check skynet-ci/backend-core-${{ matrix.shard }}
      # Same pipeline as the check, so the engine serves the file from cache.
      - name: Export dispatched nodeids
        run: dagger call skynet-ci dispatched --shard ${{ matrix.shard }} -o backend/dispatched-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatched-${{ matrix.shard }}
          path: backend/dispatched-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          overwrite: true

  backend-gates:
    name: backend · ruff + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
      # sdk/ and clients/ under .dagger/modules/skynet-ci are generated, not committed.
      - name: Generate the Dagger module SDK
        run: dagger generate -y
      # Ruff, the terraform script tests, the requirements.txt/uv.lock sync
      # check, the PostgreSQL gates (Dagger runs postgres:16-alpine as a
      # service) and the load-test SLO gate. See .dagger/modules/skynet-ci.
      - name: Ruff, script tests, requirements sync, PostgreSQL and SLO gates
        run: dagger check skynet-ci/backend-gates

  backend-shard-coverage:
    name: backend · shard coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
      # sdk/ and clients/ under .dagger/modules/skynet-ci are generated, not committed.
      - name: Generate the Dagger module SDK
        run: dagger generate -y
      - name: Collect full core suite
        run: dagger check skynet-ci/backend-shard-coverage
      - name: Export collected nodeids
        run: dagger call skynet-ci collected -o backend/collected.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collected
          path: backend/collected.txt
          if-no-files-found: ignore
          overwrite: true

  backend:
    # Keep the /4 names for required checks; shard coverage uses six shards.
    name: backend · ruff + core tests (${{ matrix.shard }}/4)
    needs: [backend-core, backend-gates, backend-shard-coverage]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Require core shards and gates
        env:
          CORE_RESULT: ${{ needs.backend-core.result }}
          GATES_RESULT: ${{ needs.backend-gates.result }}
          COVERAGE_RESULT: ${{ needs.backend-shard-coverage.result }}
        run: |
          failed=0
          if [[ "$CORE_RESULT" != success ]]; then
            echo "::error::backend-core completed with $CORE_RESULT"
            failed=1
          fi
          if [[ "$GATES_RESULT" != success ]]; then
            echo "::error::backend-gates completed with $GATES_RESULT"
            failed=1
          fi
          if [[ "$COVERAGE_RESULT" != success ]]; then
            echo "::error::backend-shard-coverage completed with $COVERAGE_RESULT"
            failed=1
          fi
          exit "$failed"
      - uses: actions/download-artifact@v4
        with:
          pattern: dispatched-*
          path: artifacts/dispatched
      - uses: actions/download-artifact@v4
        with:
          name: collected
          path: artifacts/collected
      - name: Verify dispatched shard coverage
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          shard_count = int(os.environ["CORE_SHARD_COUNT"])
          expected = {f"dispatched-{index}" for index in range(shard_count)}
          files = sorted(Path("artifacts/dispatched").rglob("dispatched-*.txt"))
          if len(files) != shard_count or {path.parent.name for path in files} != expected:
              raise SystemExit(
                  f"expected {shard_count} dispatched shard artifacts, found {[str(path) for path in files]}"
              )

          union = set()
          for path in files:
              nodeids = path.read_text(encoding="utf-8").splitlines()
              shard = set(nodeids)
              if len(nodeids) != len(shard):
                  raise SystemExit(f"{path} contains duplicate dispatched nodeids")
              if union & shard:
                  raise SystemExit(f"{path} overlaps another dispatched shard")
              union.update(shard)

          collected = Path("artifacts/collected/collected.txt").read_text(encoding="utf-8").splitlines()
          if len(collected) != len(set(collected)):
              raise SystemExit("collected.txt contains duplicate nodeids")
          if union != set(collected):
              missing = sorted(set(collected) - union)
              extra = sorted(union - set(collected))
              raise SystemExit(f"dispatched shards differ from collection: missing={missing[:10]} extra={extra[:10]}")
          print(f"six dispatched shards cover all {len(collected)} collected tests with no overlap")
          PY

  # Everything above installs through uv. The Dockerfile's other path
  # (PKG_MANAGER=pip) installs the compiled requirements.txt with --no-deps,
  # which means pip never re-resolves and never notices a package the file
  # forgot to list — `stripe` was absent from requirements.txt while
  # core/billing/service.py imported it unguarded, so a pip-path image would
  # have died on the billing import with nothing in CI to catch it. Build the
  # image that way and import the modules that actually pull the runtime deps.
  docker-pip-path:
    name: docker · pip path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (PKG_MANAGER=pip)
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            PKG_MANAGER=pip
          load: true
          tags: skynet-backend:pip
          cache-from: type=gha,scope=pip
          # Preview builds use ECR caches; keep the shared Actions cache below 10 GB.
          cache-to: type=gha,mode=min,scope=pip
      # `pip check` is the sharp end: --no-deps means pip installed the file
      # verbatim without ever validating it, so this is the first thing in the
      # pipeline that reads the wheels' own metadata. It catches both failure
      # modes we actually hit — a package the file forgot ("skynet requires
      # stripe, which is not installed") and two pins that cannot coexist
      # ("prometheus-fastapi-instrumentator 7.1.0 has requirement
      # starlette<1.0.0, but you have starlette 1.3.1").
      # The file pins a gepa git commit (reporting 0.1.4) over dspy's hard
      # gepa[dspy]==0.1.4 requirement for upstream OA engines and PxN sampling;
      # the commit's own version satisfies the pin, so everything pip check
      # emits is a real defect.
      - name: Dependency set is complete and self-consistent
        run: |
          out=$(docker run --rm skynet-backend:pip pip check 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qE 'requires|has requirement'; then
            echo "::error::pip check found real dependency problems in the pip-path image"
            exit 1
          fi
      # Importing the modules that pull the third-party surface also catches a
      # missing package, and covers anything pip metadata does not describe.
      # main/worker_main are deliberately excluded: they build the app at import
      # time and open a real Postgres connection, which this job has no business
      # standing up.
      - name: Import smoke test
        run: |
          docker run --rm skynet-backend:pip python -c "
          import core.api.app
          import core.billing.service
          import core.worker.subprocess_runner
          import core.service_gateway.optimization
          from gepa.oa import list_engines
          from gepa.optimize_anything import optimize_best_of
          assert {'gepa', 'meta_harness', 'autoresearch', 'best_of_n'} <= set(list_engines())
          from core.service_gateway.optimization.blackbox.registry import ENGINES
          assert {'autosaddler', 'shinka_evolve'} <= set(ENGINES)
          print('pip-path image imports OK')
          "
      - name: Pinned native optimizer runtime is installed
        run: |
          docker run --rm --network none skynet-backend:pip python -c "
          import shutil, subprocess
          assert subprocess.check_output(['node', '--version'], text=True).strip() == 'v22.22.0'
          assert shutil.which('claude') is None
          "

  frontend-typecheck:
    name: frontend · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
      # sdk/ and clients/ under .dagger/modules/skynet-ci are generated, not committed.
      - name: Generate the Dagger module SDK
        run: dagger generate -y
      - name: Typecheck
        run: dagger check skynet-ci/frontend-typecheck

  frontend-lint:
    name: frontend · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
      # sdk/ and clients/ under .dagger/modules/skynet-ci are generated, not committed.
      - name: Generate the Dagger module SDK
        run: dagger generate -y
      - name: Lint
        run: dagger check skynet-ci/frontend-lint

  frontend-unit:
    name: frontend · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
      # sdk/ and clients/ under .dagger/modules/skynet-ci are generated, not committed.
      - name: Generate the Dagger module SDK
        run: dagger generate -y
      - name: Unit tests
        run: dagger check skynet-ci/frontend-unit

  frontend:
    name: frontend · typecheck + lint + unit
    needs: [frontend-typecheck, frontend-lint, frontend-unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all frontend checks
        env:
          TYPECHECK_RESULT: ${{ needs.frontend-typecheck.result }}
          LINT_RESULT: ${{ needs.frontend-lint.result }}
          UNIT_RESULT: ${{ needs.frontend-unit.result }}
        run: |
          failed=0
          if [[ "$TYPECHECK_RESULT" != success ]]; then
            echo "::error::frontend-typecheck completed with $TYPECHECK_RESULT"
            failed=1
          fi
          if [[ "$LINT_RESULT" != success ]]; then
            echo "::error::frontend-lint completed with $LINT_RESULT"
            failed=1
          fi
          if [[ "$UNIT_RESULT" != success ]]; then
            echo "::error::frontend-unit completed with $UNIT_RESULT"
            failed=1
          fi
          exit "$failed"
