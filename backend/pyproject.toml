[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
"core.api" = [
    "data/*.txt",
    "data/*.LICENSE",
    "static/scalar/LICENSE",
    "static/scalar/*.js",
    "static/scalar/*.svg",
    "static/scalar/fonts/*.woff2",
    "static/scalar/fonts/OFL.txt",
]
"core.i18n_locales" = ["*.json"]
"core.local" = ["assets/*.webp"]
"core.service_gateway.optimization.blackbox" = ["shinka_requirements.txt"]

[project]
name = "skynet"
version = "0.1.0"
description = "Skynet - FastAPI service wrapper for DSPy optimization workflows"
authors = [{ name = "Skynet maintainers" }]
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "pydantic>=2.5",
    "pydantic-settings>=2.14.2",
    # ReActV2, native tool-call history and Flex all arrived in 3.3; the agent
    # layer depends on them, so there is no older line to fall back to.
    "dspy>=3.3.1,<3.4",
    # gepa is pinned to an immutable upstream commit, not a PyPI release: the
    # black-box engines (core.service_gateway.optimization.blackbox) invoke the
    # upstream optimize_anything engines and recipes through gepa.oa — Best-of-N,
    # Meta-Harness, AutoResearch and the omni composition Auto is built on — and
    # gepa.oa has no release yet. The commit still reports itself as 0.1.4, so it
    # also carries PxN batched sampling (gepa.strategies.proposal_sampling) and the
    # enable_tool_optimization adapter the training ground runs GEPA through.
    # dspy 3.3.1 pins the PyPI 0.1.4, which lacks gepa.oa; the [tool.uv]
    # override-dependencies below replaces that pin with this same source. To
    # move the pin: change the commit here, in the override below, in
    # requirements.txt and in
    # core/service_gateway/optimization/blackbox/upstream.py (GEPA_REVISION),
    # and native_runtime.py (GEPA_SOURCE), then run `uv lock` and the blackbox
    # test suite (it checks the pin agrees).
    "gepa @ git+https://github.com/gepa-ai/gepa@0632cdb5dcc052e690eab439e1b4a7e3e9cfe407",
    # Vercel Sandbox SDK: throwaway microVMs for black-box agent targets. The
    # leaf package, not the ``vercel`` umbrella — that one pins cbor2>=6, which
    # forces webauthn down a release, and pulls queue/cache/telemetry we never use.
    "vercel-sandbox>=0.10.0,<0.11",
    "litellm>=1.88.6",
    "click>=8.3.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    # Cross-replica rate limiter + login lockout (core.api.rate_limit). Optional
    # at runtime: an unset REDIS_URL fails the limiters open (see that module).
    "redis>=5,<6",
    "numpy>=1.24",
    "requests>=2.31",
    "stripe>=11,<13",
    "ldap3>=2.9",
    # Account security: TOTP two-factor codes and WebAuthn passkey ceremonies
    # (core.api.routers.account_security).
    "pyotp>=2.9",
    "webauthn>=2.5,<3",
    "python-dotenv>=1.0",
    "scalar-fastapi>=1.8",
    "scipy>=1.15.3",
    "fastmcp>=3.4.10",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-json-logger>=2.0",
    "sentry-sdk>=2.67,<3",
    "pip==26.2.1",
    "pyarrow>=17",
    # Text extraction for files attached in agent chats (core.service_gateway.agents.attachments):
    # PDF and legacy .xls. Both are pure Python with no dependencies.
    "pypdf>=6.20.0",
    "xlrd>=2",
    "pymysql>=1.1",
    # Browser web push (VAPID) for the Chrome notification channel
    # (core.notifications.channels.ChromeChannel).
    "pywebpush>=2.0",
    # core.sandbox retry backoff (SKY-408). It came in only through dspy; a
    # direct dependency keeps it if dspy drops it.
    "tenacity>=9.1",
    # No core.sandbox module imports anyio yet. It stays direct for a later
    # sync bridge into the async sandbox interface, and it came in only
    # through httpx.
    "anyio>=4.14",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.25",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.5",
    "ruff>=0.11",
    # In-memory Redis double for core.api.rate_limit tests.
    "fakeredis>=2.21",
]
load = [
    "locust>=2.0",
]
training = [
    # Optimizer-only: the training-ground harness applies MiniMax's chat
    # template to score ECHO-style observation grounding 1:1 with serving.
    # The FastAPI runtime never imports this. ``transformers`` renders the
    # chat template; ``httpx`` drives the Fireworks echo-logprob scorer.
    "transformers>=5.10.1",
    "httpx>=0.25",
]
render = [
    # Black-box scorers that render what a candidate program builds (the
    # optimize-anything 3D-unicorn case: build123d → STL → pyrender views a
    # vision model judges). Headless Linux needs PYOPENGL_PLATFORM=egl with
    # libegl1 (or =osmesa); macOS renders natively.
    "build123d>=0.11",
    "pyrender>=0.1.45",
    "trimesh>=5.0",
    "pillow>=13.0.0",
    "networkx>=3",
]
e2b = [
    # The E2B sandbox provider (core.sandbox.providers.e2b). It is not
    # allowed in production; the factory refuses it there.
    "e2b>=2.52",
]
modal = [
    # The dev-only Modal sandbox provider (core.sandbox.providers.modal).
    "modal>=1.6",
]
runloop = [
    # Runloop devbox sandbox provider (SKY-456). Imported lazily by
    # core.sandbox.providers.runloop; the default legacy backend never needs it.
    # The 3.x floor is the tested line; the provider passes allow_runloop_mirrors.
    "runloop-api-client>=3.0.0,<4",
]

[tool.uv]
# dspy 3.3.1's metadata hard-pins gepa[dspy]==0.1.4. That PyPI release ships neither
# gepa.oa, which the black-box engines are built on, nor PxN batched sampling
# (gepa.strategies.proposal_sampling), which the GEPA optimizer wiring in
# core.service_gateway.optimization needs. The pinned
# commit reports itself as 0.1.4 and is a strict superset of that release's
# optimize()/DspyAdapter surface — it only adds params
# (sampling_strategy, selection_strategy, …) and renames/removes nothing dspy calls —
# so overriding the pin is safe. The override names the same git commit as the
# dependency above so the resolver sees a single gepa source. Drop this override
# once a dspy release relaxes the pin.
override-dependencies = [
    "gepa[dspy] @ git+https://github.com/gepa-ai/gepa@0632cdb5dcc052e690eab439e1b4a7e3e9cfe407",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# Notebook cells get rewritten by Jupyter and have non-standard import order
# from kernel context; skip them. ``skynet_client.py`` is regular Python and
# stays in scope.
extend-exclude = ["usage_guide/*.ipynb"]

[tool.ruff.lint]
# Lean modern set: PEP 8 errors/style + naming + import order + pyupgrade,
# bugbear, simplify, ruff-specific, comprehensions, return, args, tidy
# imports, try/except hygiene, performance, pytest, pathlib, misc cleanups,
# async correctness, exception messages, import conventions, logging
# format, implicit-str-concat, pylint errors+warnings, refurb.
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
    "N", "C4", "RET", "ARG", "TID", "TRY", "PERF",
    "PT", "PTH", "PIE", "ASYNC", "EM", "ICN", "G",
    "ISC", "PLE", "PLW", "FURB",
]
ignore = [
    "E501",     # line length — handled by ruff format
    "TRY003",   # long messages outside exception class — too noisy with our DomainError pattern
    "TRY300",   # 'try-consider-else' — over-eager, hurts readability
    "EM101",    # raw string in exception — fine for short literal messages
    "EM102",    # f-string in exception — fine for short interpolations
    "G004",     # f-string in logging — we accept the perf cost for legibility
    "PERF203",  # try/except in loops — sometimes the right thing
    "PLW2901",  # loop variable overwritten by assignment — common idiom
    "PLW0603",  # global statement — module-level singletons (caches, embedder, fork service) are intentional
    "ARG001",   # unused function arg — too noisy on FastAPI dependency-injection sigs
    "ARG002",   # unused method arg — too noisy on protocol implementations
    "ARG003",   # unused class-method arg — too noisy on classmethod factories
    "ARG004",   # unused static-method arg
    "ARG005",   # unused lambda arg
    "RET504",   # unnecessary assignment before return — clarity wins
    "TRY301",   # raise within try — sometimes intentional
    "RUF001",   # ambiguous unicode in string — em-dash and × are intentional typography
    "RUF002",   # ambiguous unicode in docstring — em-dash and × are intentional typography
    "RUF003",   # ambiguous unicode in comment — em-dash and × are intentional typography
    "RUF012",   # mutable class default — Pydantic Field handles this; tests overrideable
    "PT011",    # pytest.raises too broad — sometimes that's the point
    "ISC001",   # conflicts with ruff format
    "TID252",   # parent-relative imports — the subpackage layout is built on these
]

[tool.ruff.lint.isort]
known-first-party = ["core", "skynet_client"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally violate some rules for clarity:
#   RUF012  mutable defaults in test fixtures
#   PLR2004 magic-number comparisons (asserting on literal values)
#   N802    function names like ``test_X_does_Y``
#   ARG     fixtures often accept and ignore parameters
#   PT012   multiple statements in raises block
#   S101    assert usage
#   TID252  relative imports inside tests
"tests/*" = ["RUF012", "ARG", "S101", "PLR2004", "PT012", "TID252"]
"core/**/tests/*" = ["RUF012", "ARG", "S101", "PLR2004", "PT012", "TID252"]

[tool.ruff.lint.pep8-naming]
# Pydantic and SQLAlchemy validators / mixins use PascalCase classmethods
# (validator, field_validator, validates) — don't flag.
# ``model_validator`` is mode-dependent (``mode="before"`` is classmethod,
# ``mode="after"`` is instance method); we use ``mode="after"`` exclusively,
# so it stays out of this list and N804 keeps catching real misuse.
classmethod-decorators = [
    "classmethod",
    "pydantic.validator",
    "pydantic.field_validator",
    "sqlalchemy.orm.validates",
]


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["usage_guide/", ".venv/"]

[tool.pytest.ini_options]
# Unit tests live next to the code they cover under ``core/<subpkg>/tests/``
# and run without Postgres, OPENAI_API_KEY, or a live server. Integration
# tests (test_llm_integration.py, test_load.py) live under ``tests/`` and
# require all three. Run each tier separately:
#
#   pytest core/ -v                          # fast CI gate, no credentials
#   pytest tests/test_llm_integration.py -v  # nightly paid tier
#   pytest tests/ -m "not slow" -v           # skip long-running LLM tests
#
testpaths = ["core", "tests", "scripts"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
    "e2e: full end-to-end tests requiring a live LLM (slow, costs API credits)",
    "slow: tests that take > 30 s to complete",
    "load: concurrency / latency stress tests",
    "docker: tests that need a running Docker daemon and a built local sandbox image",
]
