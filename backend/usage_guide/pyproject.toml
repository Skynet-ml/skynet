[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-usage-guide"
version = "0.1.0"
description = "Dependencies for the Skynet usage notebooks"
authors = [{ name = "Skynet Maintainers" }]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dspy>=3.1",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "requests>=2.31",
    "jupyter>=1.0",
]
